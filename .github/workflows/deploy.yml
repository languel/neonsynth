name: Build and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: cargo test --workspace --locked
      - run: npm run wasm
      - run: npm run test:wasm
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The exact compiled engine is useful to test the deployed ABI independently.
      - uses: actions/upload-artifact@v7
        with:
          name: chimera-wasm
          path: src/wasm/chimera.wasm
      # A temporary dependency bundle lets this restricted development environment run Rust tests.
      - run: cargo vendor --locked /tmp/chimera-vendor > /tmp/chimera-vendor-config.toml && tar -C /tmp -czf /tmp/chimera-vendor.tar.gz chimera-vendor
      - uses: actions/upload-artifact@v7
        with:
          name: chimera-vendor
          path: /tmp/chimera-vendor.tar.gz
      # Temporary bootstrap for a development sandbox that cannot download Actions artifacts.
      # These unattached Git objects do not change the branch or contain credentials.
      - name: Publish temporary bootstrap blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for item in wasm vendor; do
            if [ "$item" = wasm ]; then file=src/wasm/chimera.wasm; else file=/tmp/chimera-vendor.tar.gz; fi
            base64 -w 0 "$file" > /tmp/blob-base64
            jq -n --rawfile content /tmp/blob-base64 '{content:$content,encoding:"base64"}' > /tmp/blob-request.json
            sha=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob-request.json --jq .sha)
            echo "BOOTSTRAP_${item^^}_SHA=$sha"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
