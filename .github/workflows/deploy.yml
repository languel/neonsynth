name: Build and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: cargo test --workspace --locked
      - run: npm run wasm
      - run: npm run test:wasm
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The exact compiled engine is useful to test the deployed ABI independently.
      - uses: actions/upload-artifact@v7
        with:
          name: chimera-wasm
          path: src/wasm/chimera.wasm
      # A temporary dependency bundle lets this restricted development environment run Rust tests.
      - run: cargo vendor --locked /tmp/chimera-vendor > /tmp/chimera-vendor-config.toml && tar -C /tmp -czf /tmp/chimera-vendor.tar.gz chimera-vendor
      - uses: actions/upload-artifact@v7
        with:
          name: chimera-vendor
          path: /tmp/chimera-vendor.tar.gz
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
